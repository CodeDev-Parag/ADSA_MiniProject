<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Table Visualizer — DSA.VIZ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hash-view { margin-top: 2rem; min-height: 400px; display: flex; flex-direction: column; gap: 1rem; }
    .bucket-row { display: flex; align-items: center; margin-bottom: 0.5rem; }
    .bucket-index { width: 30px; font-family: var(--font-mono); color: var(--fg-muted); text-align: right; margin-right: 1rem; }
    .bucket-box { width: 60px; height: 60px; border: 2px solid var(--border); background: var(--node-default); display: flex; justify-content: center; align-items: center; font-family: var(--font-mono); font-weight: bold; font-size: 1.25rem; transition: all 0.3s; }
    .bucket-box.active { border-color: var(--node-updating); background: hsla(24, 95%, 53%, 0.2); box-shadow: 0 0 15px var(--node-updating); }
    .bucket-box.found { border-color: var(--node-visited); background: hsla(142, 71%, 45%, 0.2); box-shadow: 0 0 15px var(--node-visited); }
    .chain-container { display: flex; align-items: center; margin-left: 1rem; gap: 0.5rem; }
    .chain-node { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg-card); display: flex; justify-content: center; align-items: center; font-family: var(--font-mono); font-weight: bold; transition: all 0.3s; }
    .chain-arrow { color: var(--fg-muted); font-weight: bold; }
    .controls-wrapper { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .input-field { background: var(--bg-card); border: 2px solid var(--border); color: var(--fg); padding: 0.5rem 1rem; font-family: var(--font-mono); outline: none; width: 150px; }
    .input-field:focus { border-color: var(--accent); }
    .select-field { background: var(--bg-card); border: 2px solid var(--border); color: var(--fg); padding: 0.5rem 1rem; outline: none; cursor: pointer; }
    #log-container { font-family: var(--font-mono); font-size: 0.875rem; color: var(--fg-muted); height: 100px; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border); padding: 1rem; }
  </style>
</head>
<body class="dark">
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#"><span>DSA<span class="logo-dot">.</span>VIZ</span></a>
      <a href="index.html" class="btn" style="margin-left: 1rem; padding: 0.4rem 0.8rem; font-size: 0.75rem;">← Dashboard</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <div class="container">
    <section class="hero" style="padding: 2rem 0 1rem;">
      <h1>Hash Table<br><span class="accent">Collision Resolution</span></h1>
      <p class="hero-desc">Visualize how items are inserted into a hash table using Linear Probing vs Separate Chaining.</p>
    </section>

    <div class="card controls-wrapper">
      <select id="hash-type" class="select-field">
        <option value="linear">Linear Probing</option>
        <option value="chaining">Separate Chaining</option>
      </select>
      <input type="number" id="val-input" class="input-field" placeholder="Enter number..." />
      <button class="btn btn-primary" id="btn-insert">Insert</button>
      <button class="btn" id="btn-reset">Reset Table</button>
    </div>

    <div class="main-grid" style="grid-template-columns: 2fr 1fr;">
      <div class="card hash-view" id="hash-view">
        <!-- Generated by JS -->
      </div>
      <div class="sidebar">
        <div class="card">
          <h3 class="panel-title">Operations Log</h3>
          <div id="log-container"></div>
        </div>
        <div class="info-card" style="margin-top:1rem;">
          <h3>Hash Function</h3>
          <div class="info-value">h(x) = x % 7</div>
          <p id="desc-text">Linear probing resolves collisions by checking the next slot iteratively.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="hash.js"></script>
</body>
</html>
